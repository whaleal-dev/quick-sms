# 自动发布到本仓库 GitHub Packages
# https://github.com/whaleal-dev/quick-sms/packages
#
# 触发：
#   - push 分支：release-1.0.1 / release-v1.0.1
#   - 手动 workflow_dispatch（可填 version）
#
# 流程：从分支名解析版本 → 测试 → deploy Packages（已发布的版本自动跳过，只补发缺失模块）→ 创建 GitHub Release
name: Publish GitHub Packages

on:
  push:
    branches:
      - 'release-*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本，如 1.0.1（留空则从 release-* 分支名解析）'
        required: false
        type: string
      skip_tests:
        description: '跳过测试（紧急热修时使用）'
        required: false
        type: boolean
        default: false

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Test & Deploy Packages
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            # release-1.0.1 / release-v1.0.1 → 1.0.1
            REF_NAME="${GITHUB_REF_NAME}"
            VERSION="${REF_NAME#release-}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "${VERSION}" ] || [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::无法解析版本号。请使用分支 release-x.y.z，或手动传入 version。当前: ${VERSION:-empty}"
            exit 1
          fi
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "::error::正式发布不允许 SNAPSHOT: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set project version
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="${{ steps.ver.outputs.version }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Run tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true' }}
        run: mvn -B -ntp clean verify

      - name: Install all modules locally
        run: mvn -B -ntp -DskipTests install

      # GitHub Packages 同版本不可覆盖发布（重复 deploy 会 409）。
      # 策略：逐模块探测该版本是否已存在（GET pom 返回 200 视为已发布），
      # 跳过已发布的，只 deploy 缺失的模块；全部已存在则整体跳过。
      - name: Detect already-published artifacts
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BASE_URL="https://maven.pkg.github.com/whaleal-dev/quick-sms/com/whaleal"
          ARTIFACTS="quick-sms sms-all sms-api sms-core sms-providers-cn sms-providers-intl sms-runtime sms-spring-boot-starter"
          DEPLOY=""
          SKIP=""
          for ART in ${ARTIFACTS}; do
            URL="${BASE_URL}/${ART}/${VERSION}/${ART}-${VERSION}.pom"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" "${URL}")
            if [ "${CODE}" = "200" ]; then
              echo "::notice::${ART}:${VERSION} 已发布，跳过"
              SKIP="${SKIP} ${ART}"
            else
              echo "::notice::${ART}:${VERSION} 未发布，待部署 (HTTP ${CODE})"
              DEPLOY="${DEPLOY},:${ART}"
            fi
          done
          DEPLOY="${DEPLOY#,}"
          echo "deploy_modules=${DEPLOY}" >> "$GITHUB_OUTPUT"
          if [ -n "${SKIP}" ]; then
            echo "Skipped (already published):${SKIP}"
          fi

      - name: Deploy to GitHub Packages (only missing)
        if: ${{ steps.detect.outputs.deploy_modules != '' }}
        run: mvn -B -ntp -DskipTests deploy -pl ${{ steps.detect.outputs.deploy_modules }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Quick SMS ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Maven（GitHub Packages）

            ```xml
            <dependency>
              <groupId>com.whaleal</groupId>
              <artifactId>sms-all</artifactId>
              <version>${{ steps.ver.outputs.version }}</version>
            </dependency>
            ```

            仓库：`https://maven.pkg.github.com/whaleal-dev/quick-sms`

            Packages：https://github.com/whaleal-dev/quick-sms/packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
