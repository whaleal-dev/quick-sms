# 发布到 Maven Central（Sonatype Central Portal）
#
# 触发：
#   - push 分支：release-1.0.0 / release-v1.0.0
#   - 手动 workflow_dispatch
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   MAVEN_CENTRAL_USERNAME  — Central Portal User Token 用户名
#   MAVEN_CENTRAL_PASSWORD  — Central Portal User Token 密码
#   MAVEN_GPG_PRIVATE_KEY   — ASCII armored GPG 私钥
#   MAVEN_GPG_PASSPHRASE    — GPG 私钥口令
#
# 一次性准备见 docs/ci-cd.md
name: Publish Maven Central

on:
  push:
    branches:
      - 'release-*'
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号（留空则从分支名解析，如 release-1.0.0）'
        required: false
        type: string
      skip_tests:
        description: '跳过测试（紧急热修时使用）'
        required: false
        type: boolean
        default: false

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Test & Deploy Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            REF_NAME="${GITHUB_REF_NAME}"
            # release-1.0.0 / release-v1.0.0 → 1.0.0
            VERSION="${REF_NAME#release-}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "${VERSION}" ] || [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::无法解析版本号。请使用分支 release-x.y.z，或手动传入 version。当前: ${VERSION:-empty}"
            exit 1
          fi
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "::error::Maven Central 正式发布不允许 SNAPSHOT: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set project version
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="${{ steps.ver.outputs.version }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Run tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true' }}
        run: mvn -B -ntp clean verify

      # Maven Central 同版本永久不可覆盖。发布前探测 repo1.maven.org：
      # 全部构件已存在 → 跳过 deploy（避免重推 release-* 分支时挂红）；
      # 有缺失 → 正常尝试发布（Central bundle 是原子的，部分缺失时仍会失败）。
      - name: Detect already-published on Central
        id: detect
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ARTIFACTS="quick-sms sms-all sms-api sms-core sms-providers-cn sms-providers-intl sms-runtime sms-spring-boot-starter"
          MISSING=0
          for ART in ${ARTIFACTS}; do
            URL="https://repo1.maven.org/maven2/com/whaleal/${ART}/${VERSION}/${ART}-${VERSION}.pom"
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' "${URL}")
            if [ "${CODE}" = "200" ]; then
              echo "::notice::${ART}:${VERSION} 已在 Central，跳过"
            else
              echo "::notice::${ART}:${VERSION} 不在 Central (HTTP ${CODE})，需发布"
              MISSING=1
            fi
          done
          echo "need_deploy=${MISSING}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Maven Central
        if: ${{ steps.detect.outputs.need_deploy == '1' }}
        run: mvn -B -ntp -DskipTests -Pcentral clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # ── 诊断（2026-10-09 起备用）────────────────────────────────────────────
      # 起因：Central 校验报 `Bundle has content that does NOT have a .pom file`
      # 且一次列出全部 8 个 artifactId；但同 commit 的 GitHub Packages 发布正常，
      # workflow/pom 与上一次成功发布 byte 级相同，CI 日志里看不出包里多了什么。
      #
      # 另一个可疑点：日志里两处 bundle 路径不一致 ——
      #   Created bundle successfully …/target/central-staging/central-bundle.zip
      #   Going to upload               …/target/central-publishing/central-bundle.zip
      # 所以两个路径都收，若两者内容不同，那本身就是答案。
      #
      # 必须在 Deploy 失败时也执行 ⇒ 用 if: always()。
      - name: 列出 Central bundle 内容（诊断）
        if: always()
        run: |
          set -uo pipefail
          for z in target/central-publishing/central-bundle.zip target/central-staging/central-bundle.zip; do
            if [ ! -f "$z" ]; then
              echo "::warning::找不到 $z"
              continue
            fi
            echo "==================== $z  ($(stat -c%s "$z") bytes) ===================="
            unzip -l "$z"
            echo "---- 非 <artifactId>/<version>/<artifactId>-<version>.* 形状的条目 ----"
            unzip -Z1 "$z" | grep -vE '^com/whaleal/[^/]+/[^/]+/[^/]+$' || echo "(无)"
          done

      - name: 上传 Central bundle（诊断）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: |
            target/central-publishing/central-bundle.zip
            target/central-staging/central-bundle.zip
          if-no-files-found: warn
          retention-days: 14
